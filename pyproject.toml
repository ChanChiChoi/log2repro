[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "log2repro"
version = "0.2.1"
description = "Error log → runnable reproduction code generator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ChanChiChoi" },
]
keywords = ["debugging", "reproduction", "traceback", "error-log", "llm", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.9.0",
    "litellm>=1.30.0",
    "jinja2>=3.1.2",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/ChanChiChoi/log2repro"
Documentation = "https://github.com/ChanChiChoi/log2repro/tree/main/docs"
Repository = "https://github.com/ChanChiChoi/log2repro"
Issues = "https://github.com/ChanChiChoi/log2repro/issues"
Changelog = "https://github.com/ChanChiChoi/log2repro/blob/main/docs/changelog.md"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[project.scripts]
log2repro = "log2repro.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/log2repro"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
